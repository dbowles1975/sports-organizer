name: Test, publish image, and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run application tests
        run: python -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read release version
        id: version
        run: |
          VERSION=$(python -c 'import organizer; print(organizer.VERSION)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate Compose and create local smoke-test image
        env:
          API_TOKEN: smoke-test-token-not-a-real-secret-123456
          DATA_HOST_PATH: /tmp/sports-organizer-data
        run: |
          docker compose config --quiet
          docker build -t sports-organizer:smoke .
      - name: Start container and verify authenticated API
        run: python -m tools.container_smoke
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dbowles1975/sports-organizer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish versioned GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; published image tags only."
          else
            mkdir -p dist
            git archive --format=zip --prefix=sports-organizer/ --output="dist/sports-organizer-$VERSION.zip" HEAD
            gh release create "v$VERSION" "dist/sports-organizer-$VERSION.zip" --target "$GITHUB_SHA" --title "Sports Organizer $VERSION" --notes-file RELEASE_NOTES.md
          fi
